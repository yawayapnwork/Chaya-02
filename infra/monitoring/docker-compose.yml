# Monitoring stack for Chaya 02 (docs/monitoring.md, docs/adr/0003-monitoring-stack.md). Separate compose project so it
# can run next to (or on a different host than) the application infrastructure:
#   docker compose --env-file .env -f infra/monitoring/docker-compose.yml up -d
#
# Prometheus  127.0.0.1:9090   scrapes the API's /actuator/prometheus (HTTP Basic, METRICS_SCRAPE_PASSWORD)
# Grafana     127.0.0.1:3001   dashboards (provisioned) over Prometheus + Loki; admin password from .env
# Loki        (internal only)  log store, 14-day retention
# Alloy       (internal only)  ships container logs and the API log file to Loki
# GlitchTip   127.0.0.1:8000   Sentry-compatible error tracking (own Postgres + Valkey + worker, isolated here)
name: chaya-monitoring

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY}
  PORT: "8000"
  GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_PORT:-8000}
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  EMAIL_URL: consolemail://
  REDIS_URL: redis://glitchtip-valkey:6379/0
  ENABLE_USER_REGISTRATION: "false"     # accounts are created by an administrator only
  CELERY_WORKER_AUTOSCALE: "1,3"

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_scrape_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    <<: *hardening
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.10.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read access to the Docker API is effectively root on this host: acceptable for a single dev/ops host, see
      # docs/monitoring.md for the production alternative (log driver or file-based shipping).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CHAYA_LOG_DIR:-../../logs}:/var/log/chaya:ro
    depends_on: [loki]

  grafana:
    <<: *hardening
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus, loki]

  glitchtip-postgres:
    <<: *hardening
    image: postgres:17
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD}
    volumes:
      - glitchtip-db:/var/lib/postgresql/data

  glitchtip-valkey:
    <<: *hardening
    image: valkey/valkey:8

  glitchtip-migrate:
    <<: *hardening
    image: glitchtip/glitchtip:v5.1
    command: ["./bin/run-migrate.sh"]
    environment: *glitchtip-env
    depends_on: [glitchtip-postgres, glitchtip-valkey]
    restart: "no"

  glitchtip-web:
    <<: *hardening
    image: glitchtip/glitchtip:v5.1
    environment: *glitchtip-env
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8000}:8000"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

  glitchtip-worker:
    <<: *hardening
    image: glitchtip/glitchtip:v5.1
    command: ["./bin/run-celery-with-beat.sh"]
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

secrets:
  metrics_scrape_password:
    environment: METRICS_SCRAPE_PASSWORD

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  glitchtip-db:
