# Local development infrastructure. Run from the repo root:
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d
# All credentials come from .env (see .env.example); startup fails if one is missing.
#
# Hardening (docs/security-hardening.md):
#   * every published port is bound to 127.0.0.1 -- nothing is reachable from the network by default;
#   * no-new-privileges on every container; the worker additionally drops all Linux capabilities;
#   * MinIO root credentials are used only by the one-shot minio-init; the API, worker and backups each have their own
#     least-privilege account; buckets are private;
#   * Postgres: the API connects as a non-superuser app role (infra/docker/postgres/initdb).
# Image tags that float (minio, mc) should be pinned by digest for production; see the hardening doc.
name: chaya

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}           # bootstrap superuser: init and backups only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER}  # what the API uses
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not used by any service today (ARCHITECTURE.md reserves it for shared rate limiting / wake-up signalling if the
  # API is ever scaled out). Kept password-protected and bound to localhost; nothing connects to it.
  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--protected-mode", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    <<: *hardening
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the private buckets and the per-client MinIO accounts, then exits (infra/docker/minio/init.sh).
  minio-init:
    <<: *hardening
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-chaya-raw}
      S3_BUCKET_DERIVED: ${S3_BUCKET_DERIVED:-chaya-derived}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_WORKER_ACCESS_KEY: ${S3_WORKER_ACCESS_KEY:?set S3_WORKER_ACCESS_KEY}
      S3_WORKER_SECRET_KEY: ${S3_WORKER_SECRET_KEY:?set S3_WORKER_SECRET_KEY}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:?set S3_BACKUP_ACCESS_KEY}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?set S3_BACKUP_SECRET_KEY}
      S3_RECON_ACCESS_KEY: ${S3_RECON_ACCESS_KEY:-}
      S3_RECON_SECRET_KEY: ${S3_RECON_SECRET_KEY:-}
    volumes:
      - ./minio/init.sh:/init/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  clamav:
    <<: *hardening
    image: clamav/clamav:1.4
    environment:
      # Videos are large: raise clamd's stream limits (defaults are 25 MB). 4000M is clamd's maximum, and the API's
      # max-video-bytes is set to the same 4000 MiB so every accepted size can actually be scanned.
      CLAMD_CONF_StreamMaxLength: 4000M
      CLAMD_CONF_MaxFileSize: 4000M
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s # first start downloads and loads the signature database

  # The reconstruction worker. Not started by default: `docker compose --profile pipeline up`.
  # It needs the API running (on the host, port ${API_PORT}) and reaches MinIO and Keycloak over the compose network.
  reconstruction-worker:
    <<: *hardening
    profiles: ["pipeline"]
    build:
      context: ../../services/reconstruction
    cap_drop: ["ALL"]
    environment:
      CHAYA_API_URL: http://host.docker.internal:${API_PORT:-8080}
      CHAYA_TOKEN_URL: http://keycloak:8080/realms/chaya/protocol/openid-connect/token
      CHAYA_CLIENT_ID: chaya-worker
      CHAYA_CLIENT_SECRET: ${CHAYA_WORKER_CLIENT_SECRET:?set CHAYA_WORKER_CLIENT_SECRET}
      S3_ENDPOINT: http://minio:9000
      # The worker's own account: raw read-only, derived read/write, no delete (minio-init).
      S3_ACCESS_KEY: ${S3_WORKER_ACCESS_KEY:?set S3_WORKER_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_WORKER_SECRET_KEY:?set S3_WORKER_SECRET_KEY}
      WORKER_ID: compose-worker
      GROUNDING_DINO_REVISION: ${GROUNDING_DINO_REVISION:-}
      SEMANTIC_SEGMENTATION_REVISION: ${SEMANTIC_SEGMENTATION_REVISION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.0
    # Development mode with embedded storage. Production needs `start`, HTTPS, strict hostname and an external
    # database: see docs/security-hardening.md, "Keycloak".
    command: ["start-dev", "--import-realm"]
    environment:
      # Makes the token issuer stable (http://localhost:<port>/realms/chaya) whatever host name is used.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      # Substituted into infra/keycloak/chaya-realm.json at import time.
      CHAYA_WORKER_CLIENT_SECRET: ${CHAYA_WORKER_CLIENT_SECRET:?set CHAYA_WORKER_CLIENT_SECRET}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/chaya-realm.json:/opt/keycloak/data/import/chaya-realm.json:ro
    healthcheck:
      # Image has no curl; probe the management port (9000) with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  keycloak-data:
  clamav-data:
