# Overlay for the stack smoke test (scripts/ci/stack-smoke.sh, .github/workflows/reconstruction-smoke.yml):
# the real API container on top of the development infrastructure (infra/docker/docker-compose.yml).
#   docker compose --env-file <env> -f infra/docker/docker-compose.yml -f infra/ci/docker-compose.smoke.yml up -d
# The reconstruction worker runs in-process in the test (tests/integration/test_stack_e2e.py) so it can observe every
# stage; the worker IMAGE is exercised separately by the worker smoke job.
services:
  api:
    image: ${CHAYA_API_IMAGE:-chaya-api:smoke}
    build:
      context: ../../services/api
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Tokens are issued for the browser-facing issuer URL; keys are fetched over the compose network.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/chaya
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/chaya/protocol/openid-connect/certs
      CHAYA_ALLOWED_ORIGINS: http://localhost:3000
      METRICS_SCRAPE_PASSWORD: ${METRICS_SCRAPE_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
