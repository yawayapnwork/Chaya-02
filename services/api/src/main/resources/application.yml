server:
  port: ${API_PORT:8080}

spring:
  application:
    name: chaya-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true

chaya:
  security:
    issuer: ${KEYCLOAK_ISSUER_URI}
    jwks-uri: ${KEYCLOAK_JWKS_URI:}   # defaults to <issuer>/protocol/openid-connect/certs
    audience: ${KEYCLOAK_AUDIENCE:chaya-api}
    viewer-token-ttl: PT10M
    public-link-max-ttl: P30D

  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET_RAW:chaya-raw}
    derived-bucket: ${S3_BUCKET_DERIVED:chaya-derived}
  uploads:
    part-size-bytes: 8388608          # 8 MiB; S3 multipart requires >= 5 MiB except the last part
    max-video-bytes: 4294967296       # 4 GiB
    max-image-bytes: 52428800         # 50 MiB
    max-metadata-bytes: 1048576       # 1 MiB
    max-files-per-capture: 5000
    min-images-without-video: 20
  pipeline:
    time-budget-seconds: 3600
    max-time-budget-seconds: 86400
    lease-seconds: 300
    deadline-grace-seconds: 60
  clamav:
    enabled: ${CLAMAV_ENABLED:false}  # when false, uploads are quarantined, never accepted unscanned
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  cors:
    allowed-origins: ${CHAYA_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
