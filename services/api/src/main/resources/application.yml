server:
  port: ${API_PORT:8080}
  error:
    # Explicit (these are Boot's defaults): error responses never carry exception messages or stack traces.
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: chaya-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    # Runtime role: owns the schema, is NOT a superuser (infra/docker/postgres/initdb). See docs/security-hardening.md.
    username: ${POSTGRES_APP_USER}
    password: ${POSTGRES_APP_PASSWORD}
    hikari:
      connection-timeout: 5000   # fail fast (503 DATABASE_UNAVAILABLE) instead of holding requests for 30 s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true

chaya:
  security:
    issuer: ${KEYCLOAK_ISSUER_URI}
    jwks-uri: ${KEYCLOAK_JWKS_URI:}   # defaults to <issuer>/protocol/openid-connect/certs
    audience: ${KEYCLOAK_AUDIENCE:chaya-api}
    viewer-token-ttl: PT10M
    public-link-max-ttl: P30D

  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET_RAW:chaya-raw}
    derived-bucket: ${S3_BUCKET_DERIVED:chaya-derived}
  uploads:
    part-size-bytes: 8388608          # 8 MiB; S3 multipart requires >= 5 MiB except the last part
    max-video-bytes: 4194304000       # 4000 MiB: clamd's maximum stream (StreamMaxLength 4000M); larger could never be scanned
    max-image-bytes: 52428800         # 50 MiB
    max-metadata-bytes: 1048576       # 1 MiB
    max-files-per-capture: 5000
    min-images-without-video: 20
  pipeline:
    time-budget-seconds: 3600
    max-time-budget-seconds: 86400
    lease-seconds: 300
    deadline-grace-seconds: 60
  clamav:
    enabled: ${CLAMAV_ENABLED:false}  # when false, uploads are quarantined, never accepted unscanned
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  hud:
    max-pose-samples-per-request: 500
    max-quality-samples-per-request: 200
    max-pose-samples-considered: 4000  # bounds live re-planning cost; oldest poses beyond this are trimmed
    position-stale-after-ms: 8000      # no pose sample within this long -> tracking shown as unavailable
    broadcast-interval-ms: 750         # minimum spacing between SSE pushes for one capture
    heartbeat-interval-ms: 15000       # SSE comment sent when nothing changed, to keep the connection open
    emitter-timeout-ms: 300000         # server-side SSE connection lifetime; the client reconnects
  cors:
    allowed-origins: ${CHAYA_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: ${CHAYA_RATE_LIMIT_ENABLED:true}
    public-link-exchange-per-minute: 10
    anonymous-per-minute: 120
    authenticated-per-minute: 1200
    search-per-minute: 60
  health:
    cache-ttl: PT5S
    queue-stall-after: PT15M
  metrics:
    scrape-password: ${METRICS_SCRAPE_PASSWORD:}   # empty: /actuator/prometheus is closed to everyone
    refresh-interval: PT30S
  search:
    vision-service-url: ${VISION_SERVICE_URL:http://localhost:8090}
    vision-timeout: PT5S
    default-top-k: 10
    max-top-k: 50
    # POI versions without an embedding are embedded by PoiEmbeddingBackfill this often, this many per pass.
    embedding-backfill-interval: PT5S
    embedding-backfill-batch: 50
    # Vision circuit breaker: after a failed call, searches fall back at once and a probe checks this often.
    vision-probe-interval: PT5S
    # Relevance (SemanticSearchService): margin over the venue mean, calibrated in benchmarks/b3_semantic_search.
    relevance-min-margin: 0.078
    relevance-min-pois: 8
    closest-matches: 3
  navigation:
    standard-walking-speed-mps: 1.3
    accessible-walking-speed-mps: 1.0
    min-accessible-clearance-m: 0.9
    stairs-transition-seconds: 20
    elevator-transition-seconds: 45
    transition-match-radius-meters: 5.0
    node-snap-max-distance-meters: 10.0
  rescan:
    # The control plane's own copy of the alignment quality gate (see dev.chaya.api.rescan.RescanService
    # and chaya_worker.region_alignment.alignment_confidence); re-checked here independently of whatever
    # the worker's own MIN_ALIGNMENT_CONFIDENCE is set to, so a badly aligned splice is refused even if the
    # worker's own configuration were wrong.
    min-alignment-confidence: 0.6
    min-region-area-square-meters: 1.0
    max-region-area-square-meters: 2000.0
  frames:
    # Coordinate-frame calibration acceptance limits (dev.chaya.api.frame.FrameProperties, docs/coordinate-frames.md).
    # A calibration whose own references disagree by more than these is refused, never averaged into a "metric" frame.
    min-distance-references: 2
    max-scale-relative-spread: 0.03
    max-control-point-rms-m: 0.05
    max-floor-points-rms-m: 0.05
    max-gravity-disagreement-deg: 5.0
    max-device-gravity-tilt-deg: 10.0

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: chaya-api
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true          # /actuator/health/liveness and /actuator/health/readiness
      group:
        # Liveness: the JVM and application context are alive. Never includes dependencies, so an outage makes the
        # API unready rather than restarted in a loop.
        liveness:
          include: livenessState
        # Readiness: startup finished (Flyway migrations included) AND the real dependencies answer
        # (dev.chaya.api.health.DependenciesHealthIndicator). This is what container health checks and load
        # balancers use.
        readiness:
          include: readinessState,db,dependencies
