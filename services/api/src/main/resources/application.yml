server:
  port: ${API_PORT:8080}

spring:
  application:
    name: chaya-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true

chaya:
  security:
    issuer: ${KEYCLOAK_ISSUER_URI}
    jwks-uri: ${KEYCLOAK_JWKS_URI:}   # defaults to <issuer>/protocol/openid-connect/certs
    audience: ${KEYCLOAK_AUDIENCE:chaya-api}
    viewer-token-ttl: PT10M
    public-link-max-ttl: P30D

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
