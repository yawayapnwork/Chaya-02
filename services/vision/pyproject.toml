[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaya-vision"
version = "0.1.0"
description = "Chaya 02 vision service: real-time CLIP text embeddings for dev.chaya.api.search."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# The actual embedding model. Detected at runtime (app.clip_text_encoder); without it /v1/embed-text
# answers 503, never a fake vector -- see app/main.py.
# torch>=2.6: open_clip loads the checkpoint with torch.load, which is only safe by default from 2.6 (CVE-2025-32434).
model = ["torch>=2.6", "open_clip_torch>=2.24"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, isort, pyupgrade, bandit (security)
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = [
  "E501",  # long lines are allowed up to the formatter's judgement; line-length above is advisory
  "S603",  # subprocess with an argv list and no shell is how stages run FFmpeg/COLMAP on purpose
  "S607",  # tools are resolved by chaya_worker.toolchain, which records the resolved path and version
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]  # assert is how pytest checks; temp paths in fixtures
