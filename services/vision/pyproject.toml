[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaya-vision"
version = "0.1.0"
description = "Chaya 02 vision service: real-time CLIP text embeddings for dev.chaya.api.search."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# The actual embedding model. Detected at runtime (app.clip_text_encoder); without it /v1/embed-text
# answers 503, never a fake vector -- see app/main.py.
model = ["torch>=2.2", "open_clip_torch>=2.24"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
