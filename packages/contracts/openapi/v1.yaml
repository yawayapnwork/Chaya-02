  /api/v1/venues/{venueId}/search:
    get:
      description: "q: natural-language query (required), e.g. 'find the nearest staircase'.\
        \ floorId: restrict to one floor. topK: result count (clamped to chaya.search.max-top-k).\
        \ accessible: only POIs marked accessible (a query asking for an accessible\
        \ place sets it too). scanVersionId: only the POIs of that FINALIZED scan\
        \ version. position (x,y,z canonical metres) and positionFloorId: the searcher's\
        \ position on that floor, in its current coordinate frame (or the scan version's);\
        \ a query asking for the nearest one is then ordered by walking-route distance\
        \ from it. Without a position 'nearest' is reported as not applied. Rate limited\
        \ per caller (chaya.rate-limit.search-per-minute)."
      operationId: searchSearch
      parameters:
      - in: path
        name: venueId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: q
        required: true
        schema:
          type: string
      - in: query
        name: floorId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: topK
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: accessible
        required: false
        schema:
          type: boolean
      - in: query
        name: scanVersionId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: position
        required: false
        schema:
          type: array
          items:
            type: number
            format: double
      - in: query
        name: positionFloorId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Malformed request: an unparseable parameter or body, or a\
            \ failed validation (code BAD_REQUEST or an operation-specific code)"
        "401":
          description: "Missing, invalid or expired credentials (empty body, WWW-Authenticate\
            \ header)"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The caller's roles do not allow this operation (empty body),\
            \ or an operation-specific refusal (problem with a code)"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not found, or not visible to the caller's organization or\
            \ venue (code NOT_FOUND)"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Rate limit exceeded (code RATE_LIMITED); see the Retry-After
            header
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "A dependency is unavailable (code DATABASE_UNAVAILABLE, STORAGE_UNAVAILABLE\
            \ or AUTHENTICATION_UNAVAILABLE); the request was not completed"
      security:
      - bearerAuth: []
      - viewerToken: []
      summary: Semantic POI search
      tags:
      - search-controller
      x-chaya-roles:
      - ADMIN
      - VENUE_MANAGER
      - OPERATOR
      - VIEWER
      - PUBLIC_VIEWER
