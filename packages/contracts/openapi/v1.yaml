openapi: 3.1.0
info:
  title: Chaya 02 API
  version: 1.0.0
  description: >
    Version 1 of the Chaya 02 HTTP API. Breaking changes require a new /api/v2 document.
    This file is the contract; the backend and clients are checked against it.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      summary: Backend health, including real dependency checks
      responses:
        "200":
          description: All checked dependencies are up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A dependency is down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/version:
    get:
      summary: Build and API version
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /api/v1/venues/{venueId}/floors:
    get: { summary: List floors of a venue, responses: { "200": { description: Floors } } }
    post: { summary: Create a floor (admin, venue-manager), responses: { "201": { description: Created } } }
  /api/v1/venues/{venueId}/captures:
    get: { summary: List capture sessions, responses: { "200": { description: Capture sessions } } }
    post: { summary: Create a capture session, responses: { "201": { description: Created (status CREATED) } } }
  /api/v1/venues/{venueId}/captures/{captureId}:
    get: { summary: Inspect a capture session, responses: { "200": { description: Capture session } } }
  /api/v1/venues/{venueId}/captures/{captureId}/media:
    get: { summary: List capture artifacts, responses: { "200": { description: Media items } } }
    post:
      summary: Open a resumable multipart upload for one file
      responses:
        "201": { description: "mediaId, partSizeBytes, totalParts" }
        "413": { description: File larger than the limit for its kind }
        "415": { description: Content type not allowed }
  /api/v1/venues/{venueId}/captures/{captureId}/media/{mediaId}:
    get: { summary: Media status and uploaded parts, responses: { "200": { description: Media item } } }
  /api/v1/venues/{venueId}/captures/{captureId}/media/{mediaId}/parts/{partNumber}:
    put:
      summary: Upload one part (raw body, exact length; optional X-Part-Sha256 header). Idempotent.
      responses: { "204": { description: Stored }, "422": { description: Part checksum mismatch } }
  /api/v1/venues/{venueId}/captures/{captureId}/media/{mediaId}/complete:
    post: { summary: Assemble and start asynchronous validation (also retries QUARANTINED), responses: { "202": { description: Validation started } } }
  /api/v1/venues/{venueId}/captures/{captureId}/complete-upload:
    post: { summary: Finish the upload phase, responses: { "200": { description: READY_FOR_PROCESSING }, "409": { description: Not ready } } }
  /api/v1/venues/{venueId}/captures/{captureId}/processing:
    get: { summary: "Run status (RUNNING/SUCCEEDED/PARTIAL/FAILED/CANCELLED, quality FINAL|PARTIAL|null), per-stage execution records, job history", responses: { "200": { description: Processing status } } }
    post: { summary: "Start the reconstruction pipeline (body: optional timeBudgetSeconds, privacyEnabled - false is admin only)", responses: { "202": { description: Accepted; first stage queued } } }
  /api/v1/venues/{venueId}/captures/{captureId}/processing/retry:
    post: { summary: Re-queue the stage a FAILED run stopped at (fresh time budget; bounded retries), responses: { "202": { description: Accepted }, "409": { description: Run is not FAILED or retries are exhausted } } }
  /api/v1/venues/{venueId}/captures/{captureId}/processing/cancel:
    post: { summary: Cancel a RUNNING run, responses: { "200": { description: Cancelled } } }
  /api/v1/venues/{venueId}/captures/{captureId}/route-plan:
    post: { summary: "Plan the secondary capture route after the recon lap (deterministic; request: scene, trajectory, optional observedRegions/candidates/config; response: ordered waypoints, route, distance, time, confidence, baseline vs planned coverage, uncovered regions). See docs/route-planning.md", responses: { "200": { description: Route plan }, "409": { description: Capture is no longer being captured }, "422": { description: "Input cannot be planned from (TRAJECTORY_OUTSIDE_SCENE, INVALID_CONFIG, ...)" } } }
  /api/v1/venues/{venueId}/captures/{captureId}/hud/scene:
    put: { summary: "Set (or replace) the room outline the live HUD measures coverage against; validated immediately against the planner. See docs/capture-hud.md", responses: { "204": { description: Stored }, "409": { description: Capture is no longer being captured }, "422": { description: Invalid geometry } } }
  /api/v1/venues/{venueId}/captures/{captureId}/hud/pose:
    post: { summary: Append device pose samples (position, optional heading) reported while capturing, responses: { "202": { description: Accepted }, "400": { description: Too many samples in one request } } }
  /api/v1/venues/{venueId}/captures/{captureId}/hud/quality:
    post: { summary: Append client-computed frame-quality samples (blur/motion/exposure/feature/spacing; never image bytes), responses: { "202": { description: Accepted } } }
  /api/v1/venues/{venueId}/captures/{captureId}/hud/status:
    get: { summary: "Durable, poll-friendly HUD status: tracking, coverage, uncovered zones, planned path, quality summary, reshoot recommendations", responses: { "200": { description: HUD status } } }
  /api/v1/venues/{venueId}/captures/{captureId}/hud/stream:
    get: { summary: The same HUD status, pushed over Server-Sent Events as it changes, responses: { "200": { description: "text/event-stream of HUD status" } } }
  /api/v1/venues/{venueId}/ops/access:
    get: { summary: "Operations dashboard: which sections the caller may read and whether they may retry/cancel processing. See docs/operations-dashboard.md", responses: { "200": { description: Access } } }
  /api/v1/venues/{venueId}/ops/overview:
    get: { summary: "Venue overview, per-floor current finalized version, latest reconstruction (quality FINAL|PARTIAL|null) and freshness timestamps/ages (all roles)", responses: { "200": { description: Overview } } }
  /api/v1/venues/{venueId}/ops/coverage:
    get: { summary: "Per-floor coverage gaps; measured coverage recomputed from the latest capture with a HUD outline (admin, venue-manager, operator)", responses: { "200": { description: Coverage }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/venues/{venueId}/ops/jobs:
    get: { summary: "Job counts per status and recent jobs with retry/cancel availability (query: status, limit<=200)", responses: { "200": { description: Jobs }, "400": { description: INVALID_JOB_STATUS }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/venues/{venueId}/ops/failures:
    get: { summary: "Currently failed runs, stage failure history and counts by code (query: days<=365)", responses: { "200": { description: Failures }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/venues/{venueId}/ops/storage:
    get: { summary: "Recorded raw media and artifact sizes, measured worker time per stage, cost (available=false when untracked)", responses: { "200": { description: Storage }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/venues/{venueId}/ops/search-analytics:
    get: { summary: "Logged search queries: count, zero-result count, latency avg/p95, top and zero-result terms; POI counts (admin, venue-manager; query: days)", responses: { "200": { description: Search analytics }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/venues/{venueId}/ops/rescans:
    get: { summary: "Region re-scan history with run outcome and resulting version (admin, venue-manager, operator)", responses: { "200": { description: Re-scans }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/venues/{venueId}/ops/audit:
    get: { summary: "This venue's audit trail, newest first (admin, venue-manager; query: limit<=500)", responses: { "200": { description: Audit entries }, "403": { description: OPS_SECTION_FORBIDDEN } } }
  /api/v1/internal/jobs/claim:
    post: { summary: "Worker: claim the oldest queued job of the given stage(s); returns a work order (inputs, output prefix, deadline). Service role only.", responses: { "200": { description: Work order }, "204": { description: Nothing queued } } }
  /api/v1/internal/jobs/{jobId}/heartbeat:
    post: { summary: "Worker: extend the lease; keepGoing=false means stop (cancelled or lease lost)", responses: { "200": { description: "{keepGoing, deadlineAt}" } } }
  /api/v1/internal/jobs/{jobId}/report:
    post: { summary: "Worker: submit the stage record (command, timings, exit status, checksums, log locations, artifacts, error). Verified before it is applied.", responses: { "200": { description: Applied }, "409": { description: Rejected (ARTIFACT_MISSING, PII_AFTER_PRIVACY, JOB_NOT_RUNNING ...) } } }
components:
  schemas:
    Health:
      type: object
      required: [status, database, storage]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        database: { type: string, enum: [UP, DOWN] }
        storage: { type: string, enum: [UP, DOWN] }
    Version:
      type: object
      required: [name, version, apiVersion]
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: string, examples: [v1] }
