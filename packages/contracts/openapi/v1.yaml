components:
  schemas:
    Access:
      type: object
      properties:
        mayControlProcessing:
          type: boolean
        roles:
          type: array
          items:
            type: string
        sections:
          type: object
          additionalProperties:
            type: boolean
        venueId:
          type: string
          format: uuid
    Action:
      type: object
      properties:
        available:
          type: boolean
        captureId:
          type: string
          format: uuid
        reason:
          type: string
        via:
          type: string
          enum:
          - PIPELINE_RUN
          - JOB
    Anchor:
      type: object
      properties:
        calibrationStatus:
          type: string
        coordinateFrameId:
          type: string
          format: uuid
        digitalPose:
          $ref: "#/components/schemas/Pose"
        floorId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        lastCalibratedAt:
          type: string
          format: date-time
        markerIdentifier:
          type: string
        markerSizeMeters:
          type: number
          format: double
        markerType:
          type: string
        physicalPose:
          $ref: "#/components/schemas/Pose"
        poseId:
          type: string
          format: uuid
        poseRevision:
          type: integer
          format: int32
        scanVersionId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
    AnchorObservation:
      type: object
      properties:
        anchorId:
          type: string
          format: uuid
        observedPose:
          $ref: "#/components/schemas/Pose"
      required:
      - anchorId
