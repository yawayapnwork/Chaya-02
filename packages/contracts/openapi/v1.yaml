    viewerToken:
      description: "Short-lived public-viewer token from POST /api/v1/public/viewer-token,\
        \ bound to one venue; acts as PUBLIC_VIEWER. Never together with a bearer\
        \ token (400)."
      in: header
      name: X-Chaya-Viewer-Token
      type: apiKey
