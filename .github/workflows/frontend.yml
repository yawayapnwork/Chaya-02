# Web app: lint, unit tests, typecheck, production build, browser e2e (mocked backend).
# Also triggered by the worker's .ksplat encoder and the shared fixtures: lib/ksplat-compat.test.ts (unit tests) and
# e2e/ksplat-viewer.spec.ts load the production .ksplat fixture with the pinned GaussianSplats3D.
name: frontend

on:
  pull_request:
    paths: ["apps/web/**", "packages/contracts/fixtures/**", "services/reconstruction/chaya_worker/ksplat.py", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/contracts/fixtures/**", "services/reconstruction/chaya_worker/ksplat.py", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build (no environment-specific values baked in)
        # Deliberately no NEXT_PUBLIC_* / CHAYA_PUBLIC_*: the image must build without them and read them at runtime.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright (backend and identity provider mocked per test; see playwright.config.ts)
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
