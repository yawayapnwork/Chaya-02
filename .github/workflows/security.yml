# Dependency vulnerability and license scanning (docs/security-hardening.md, THIRD_PARTY_LICENSES.md).
# License results are an engineering gate against scripts/licenses/policy.json, not a legal opinion: a "review"
# verdict needs a recorded human decision in THIRD_PARTY_LICENSES.md.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Vulnerabilities (production dependencies, high and above fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Licenses (production dependency tree)
        run: node ../../scripts/licenses/npm-licenses.mjs --prod | tee npm-licenses.txt
        continue-on-error: true # known "review" items are recorded in THIRD_PARTY_LICENSES.md; see the report
      - uses: actions/upload-artifact@v4
        with:
          name: npm-licenses
          path: apps/web/npm-licenses.txt

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [reconstruction, vision]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the service into a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip pip-audit
          /tmp/venv/bin/pip install ./services/${{ matrix.service }}
      - name: Vulnerabilities (installed environment)
        run: /tmp/venv/bin/pip-audit --progress-spinner off
      - name: Licenses (installed environment)
        run: /tmp/venv/bin/python scripts/licenses/python-licenses.py --exclude chaya-worker chaya-vision pip-audit | tee python-licenses-${{ matrix.service }}.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: python-licenses-${{ matrix.service }}
          path: python-licenses-${{ matrix.service }}.txt

  maven:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Vulnerabilities (OWASP Dependency-Check, CVSS >= 7 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdApiKey="$NVD_API_KEY"
      - name: Licenses (third-party report; unknown licenses fail)
        run: >
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.4.0:add-third-party
          -Dlicense.failOnMissing=true -Dlicense.includedScopes=compile,runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-reports
          path: |
            services/api/target/dependency-check-report.*
            services/api/target/generated-sources/license/THIRD-PARTY.txt
