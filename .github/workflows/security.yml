# Dependency vulnerability and license scanning (docs/security-hardening.md, THIRD_PARTY_LICENSES.md).
# License results are an engineering gate against scripts/licenses/policy.json, not a legal opinion: a "review"
# verdict needs a recorded human decision in THIRD_PARTY_LICENSES.md. The license steps FAIL the job on a denied or
# unknown license, or on a review license that is not already listed as pending_review (known and awaiting a decision).
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Vulnerabilities (production dependencies, high and above fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Licenses (production dependency tree)
        run: |
          set -o pipefail
          node ../../scripts/licenses/npm-licenses.mjs --prod | tee npm-licenses.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: npm-licenses
          path: apps/web/npm-licenses.txt

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [reconstruction, vision]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The scanners live in their own environment: installed next to the service, pip-audit's own dependencies
      # would be license-scanned as if the service shipped them.
      - name: Install the service into a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install ./services/${{ matrix.service }}
          /tmp/venv/bin/pip freeze --exclude-editable | grep -v '^chaya-' > /tmp/frozen.txt
          python -m venv /tmp/tools
          /tmp/tools/bin/pip install pip-audit
      - name: Vulnerabilities (exact versions installed)
        run: /tmp/tools/bin/pip-audit -r /tmp/frozen.txt --no-deps --disable-pip --progress-spinner off
      - name: Licenses (installed environment)
        run: |
          set -o pipefail
          /tmp/venv/bin/python scripts/licenses/python-licenses.py --exclude chaya-worker chaya-vision | tee python-licenses-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-licenses-${{ matrix.service }}
          path: python-licenses-${{ matrix.service }}.txt

  maven:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Vulnerabilities (OWASP Dependency-Check, CVSS >= 7 fails)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdApiKey="$NVD_API_KEY"
      - name: Licenses (third-party report; missing license metadata fails)
        run: >
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.4.0:add-third-party
          -Dlicense.failOnMissing=true -Dlicense.includedScopes=compile,runtime
      - name: Licenses (policy check against scripts/licenses/policy.json)
        run: |
          set -o pipefail
          python3 ../../scripts/licenses/maven-licenses.py target/generated-sources/license/THIRD-PARTY.txt | tee target/maven-licenses.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: maven-reports
          path: |
            services/api/target/dependency-check-report.*
            services/api/target/generated-sources/license/THIRD-PARTY.txt
            services/api/target/maven-licenses.txt
