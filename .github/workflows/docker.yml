# Container images: build all four, scan them, and publish to GitHub Container Registry.
#
#   pull_request   build + scan, never push
#   push to main   build + scan + push  ghcr.io/<owner>/chaya-<service>:sha-<short>  and  :main
#   tag v*.*.*     build + scan + push  :<version>, :<major>.<minor>, :sha-<short>
#
# Images carry an SBOM and SLSA provenance attestation. Deployments reference the immutable sha-<short> tag (or the
# digest), never :main (DEPLOYMENT.md).
name: docker

on:
  pull_request:
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "services/reconstruction/**"
      - "services/vision/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # push to GHCR (only used when pushing)
      id-token: write        # provenance attestation signing
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: services/api
          - service: web
            context: apps/web
          - service: worker
            context: services/reconstruction
          - service: vision
            context: services/vision
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        # GHCR repository names must be lowercase; the owner may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chaya-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=chaya-${{ matrix.service }}

      # Build once, load locally for the scan; push the same build afterwards (cache makes the second step a no-op).
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: chaya-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Image runs as non-root
        run: |
          user=$(docker image inspect chaya-${{ matrix.service }}:scan --format '{{.Config.User}}')
          echo "User=$user"
          case "$user" in ""|0|root|0:0|root:root) echo "::error::image runs as root"; exit 1;; esac

      - name: Image has a health check
        run: |
          hc=$(docker image inspect chaya-${{ matrix.service }}:scan --format '{{json .Config.Healthcheck}}')
          echo "$hc"
          [ "$hc" != "null" ] || { echo "::error::no HEALTHCHECK"; exit 1; }

      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chaya-${{ matrix.service }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          scanners: vuln,secret

      - name: Build and push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
