# Reconstruction smoke tests. No GPU and no full reconstruction: GPU/toolchain stages are EXCLUDED explicitly
# (services/reconstruction/tests/smoke/test_pipeline_smoke.py: EXCLUDED_IN_CI) and only their orchestration contract
# is tested. The full reconstruction runs only on a GPU host (`pytest -m gpu`), never in normal CI.
#
#   worker-smoke  capture -> worker claim loop -> real CPU stages -> ARTIFACT_GENERATION (.ksplat, manifest, bundle)
#   image-smoke   the same test, run inside the production worker image (proves its FFmpeg/OpenCV actually work)
#   stack-smoke   capture upload -> ClamAV -> API -> processing -> real worker code, through the real API, MinIO and
#                 Keycloak; the run must stop with a structured DEPENDENCY_UNAVAILABLE at POSE_ESTIMATION (no COLMAP on
#                 the runner; every stage is implemented, the later ones need COLMAP, CUDA and Open3D). Then the
#                 stack's data is backed up and restored into an isolated environment, where this build's API must boot
#                 (scripts/backup/restore-drill.sh)
name: reconstruction-smoke

on:
  pull_request:
    paths:
      - "services/reconstruction/**"
      - "services/api/**"
      - "infra/docker/**"
      - "infra/mirror/**"
      - "infra/ci/**"
      - "infra/keycloak/**"
      - "scripts/ci/**"
      - "scripts/backup/**"
      - ".github/workflows/reconstruction-smoke.yml"
  push:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"   # nightly: catches drift in base images, ClamAV, Keycloak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/reconstruction
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/reconstruction/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      # tests/smoke/test_splat_artifact_smoke.py needs CPU torch (it skipped as a whole module without it, and the job
      # still passed) and the web app's pinned viewer library. Pinned as in the python workflow.
      - name: CPU PyTorch (pinned; the GPU image's version)
        run: pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: The web app's pinned viewer library (npm ci from apps/web's lockfile)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Smoke (real CPU stages; GPU stages excluded, contract-tested; required, no skips)
        run: |
          set +e
          python -m pytest -m smoke tests/smoke -v -rA --junitxml=smoke.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" smoke.xml --label "worker smoke (required)" --mode required \
            | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/reconstruction
          load: true
          tags: chaya-worker:smoke
          cache-from: type=gha,scope=worker
      - name: Health check fails before any control-plane call (not healthy just because it started)
        run: |
          if docker run --rm chaya-worker:smoke python -m chaya_worker.liveness; then
            echo "::error::a worker that never reached the control plane reported healthy"; exit 1
          fi
      - name: Smoke inside the production image
        # Test-only tools (pinned) are installed into a throwaway container as root; the image itself stays non-root and
        # lean. The CPU image has no torch by design (Dockerfile), so the splat-artifact smoke skips here, and only that
        # skip is allowed: it runs, required, in worker-smoke above and in the python workflow.
        run: |
          mkdir -p out
          set +e
          docker run --rm --user 0 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/services/reconstruction:/src:ro" -v "$PWD/out:/out" -w /src chaya-worker:smoke \
            sh -c "pip install -q pytest==8.4.1 scikit-image==0.26.0 && python -m pytest -p no:cacheprovider -m smoke tests/smoke -v -rA --junitxml=/out/image-smoke.xml"
          tests=$?
          python3 scripts/ci/pytest-summary.py out/image-smoke.xml --label "worker smoke inside the production image (required)" \
            --mode required --expected-skip "torch is not installed" | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/reconstruction/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e "services/reconstruction[dev]"
      - name: MinIO preflight (fresh pull of the pinned GHCR mirror, digest check, start, S3 round trip)
        run: bash scripts/ci/minio-preflight.sh
      - name: Stack smoke (API, Postgres, MinIO, ClamAV, Keycloak)
        run: bash scripts/ci/stack-smoke.sh
        env:
          PYTHON: python
