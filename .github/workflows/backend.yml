# API: full test suite (unit + integration against real PostgreSQL/pgvector and MinIO via Testcontainers) and package.
name: backend

on:
  pull_request:
    paths: ["services/api/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["services/api/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package
        run: mvn -B -ntp verify
      - name: Integration tests actually ran
        # Testcontainers suites skip (not fail) without Docker. A green build must mean they RAN, so check that these
        # Testcontainers-backed classes executed with zero skips. (ClamAvLiveTest/KeycloakLiveTest are opt-in via
        # environment variables and may skip.)
        run: |
          fail=0
          for cls in AuthenticationTest PipelineControlPlaneTest OpsDashboardApiTest CaptureIngestionTest WorkerUnavailableHealthTest; do
            f="target/surefire-reports/TEST-dev.chaya.api.$cls.xml"
            if [ ! -f "$f" ]; then echo "::error::$cls did not run"; fail=1; continue; fi
            tests=$(grep -o '<testsuite[^>]*' "$f" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')
            skipped=$(grep -o '<testsuite[^>]*' "$f" | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*')
            echo "$cls: tests=$tests skipped=$skipped"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then echo "::error::$cls was skipped"; fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: surefire-reports
          path: services/api/target/surefire-reports/
          retention-days: 14
