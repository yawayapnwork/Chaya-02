# Deployment and backup scripts: static checks, and deploy.sh's control flow against stubs (scripts/deploy/test-deploy.sh):
# configuration validation, the migration rehearsal gate, automatic rollback of an unhealthy version, and that no secret
# from .env reaches the output; and the restore drill against good and bad synthetic backups (test-restore-drill.sh).
# The real backup -> isolated restore drill on real stack data runs in reconstruction-smoke (stack-smoke.sh).
name: ops

on:
  pull_request:
    paths: ["infra/deploy/**", "scripts/backup/**", "scripts/deploy/**", "scripts/ci/**", ".github/workflows/ops.yml"]
  push:
    branches: [main]
    # No path filter on main: the deploy gate (scripts/ci/require-green.sh) requires this workflow's run for the exact
    # commit being deployed. Pull requests stay path-filtered (DEPLOYMENT.md "Deploy gate").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (warnings and errors)
        run: shellcheck -S warning infra/deploy/*.sh scripts/backup/*.sh scripts/deploy/*.sh scripts/ci/*.sh
      - name: deploy.sh control flow and rollback
        run: bash scripts/deploy/test-deploy.sh
      - name: deploy gate (require-green.sh) against recorded run lists
        run: bash scripts/ci/test-require-green.sh
      - name: restore drill fails on a bad backup (corrupted, missing, tampered) and passes on a good one
        run: bash scripts/backup/test-restore-drill.sh
      - name: the object mirror belongs to the backup user, so erasures and cleanup can delete from it
        # The runner is a non-root user, so root-owned files (the mc container runs as root) would fail here.
        run: bash scripts/backup/test-backup-ownership.sh
      - name: deploy bundle contains the restore drill
        run: |
          bash scripts/deploy/bundle.sh "$RUNNER_TEMP/bundle"
          test -x "$RUNNER_TEMP/bundle/scripts/backup/restore-drill.sh"
