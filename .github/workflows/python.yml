# Python services: lint (ruff: pyflakes, pycodestyle, bugbear, isort, pyupgrade, bandit) and tests.
#
# Every test is reported as passed, failed, expected skip (an allowlisted reason) or not executed (scripts/ci/pytest-summary.py
# reads pytest's JUnit XML). The CPU suite may not skip anything outside the allowlist: its dependencies are installed here,
# pinned, so a skip means a test that should have run did not. The worker's `gpu`, `integration` and `acceptance` tests cannot
# run on this runner (no GPU, no stack): they are selected separately and listed as NOT executed, with their reasons. GPU tests
# run in the gpu workflow on a GPU runner; the stack tests in reconstruction-smoke and acceptance (docs/ACCEPTANCE.md). The
# `open3d` tests (synthetic reconstruction on the CPU with Open3D, in tests/gpu) are required in the open3d job. Open3D stays out
# of the main job on purpose: its tests of the "toolchain missing" contract need an environment without it.
name: python

on:
  pull_request:
    paths: ["services/reconstruction/**", "services/vision/**", "packages/contracts/fixtures/**", "packages/contracts/viewer/**",
            "apps/web/package-lock.json", "apps/web/scripts/verify-ksplat-artifact.ts", "scripts/ci/check-fixtures.sh",
            "scripts/ci/pytest-summary.py", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["services/reconstruction/**", "services/vision/**", "packages/contracts/fixtures/**", "packages/contracts/viewer/**",
            "apps/web/package-lock.json", "apps/web/scripts/verify-ksplat-artifact.ts", "scripts/ci/check-fixtures.sh",
            "scripts/ci/pytest-summary.py", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one skip the CPU suite allows: test_unwritten_stages_never_succeed... is parametrized over the stages still marked
  # planned, of which there are none today ("got empty parameter set").
  CPU_EXPECTED_SKIPS: "got empty parameter set"
  # The Grounding DINO processor files the training-harness smoke builds its tiny detector around (tests/ml), pinned like
  # the production model (docs/ML_EVALUATION.md). Only *.json/*.txt (about 1 MB): no weights are downloaded.
  GDINO_PROCESSOR_REVISION: a2bb814dd30d776dcf7e30523b00659f4f141c71

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [reconstruction, vision]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: System tools the worker's CPU stages execute
        if: matrix.service == 'reconstruction'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build chaya-navmesh (real Recast/Detour; recastnavigation pinned by SHA-256 in its CMakeLists.txt)
        if: matrix.service == 'reconstruction'
        run: |
          cmake -S native/chaya-navmesh -B native/chaya-navmesh/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/chaya-navmesh/build -j "$(nproc)"
          native/chaya-navmesh/build/chaya-navmesh --version
      # The splat artifact smoke loads the trained .ksplat with the viewer library the web app ships
      # (tests/smoke/test_splat_artifact_smoke.py, apps/web/scripts/verify-ksplat-artifact.ts). Without these it skipped.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.service == 'reconstruction'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: The web app's pinned viewer library (npm ci from apps/web's lockfile)
        if: matrix.service == 'reconstruction'
        working-directory: apps/web
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: pip install -e ".[dev]"
      - name: CPU PyTorch and transformers, pinned (no GPU here; gsplat's CUDA training runs only on GPU hosts)
        if: matrix.service == 'reconstruction'
        # torch 2.7.1 as in the GPU image (services/reconstruction/Dockerfile.gpu); transformers 4.57.1 as in the ML evaluation
        # image (benchmarks/docker/ml-eval.Dockerfile). transformers runs the training-harness smoke on tiny random models
        # (tests/ml); without it those tests skipped.
        run: |
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.1"
      - name: Cache the pinned Grounding DINO processor files
        if: matrix.service == 'reconstruction'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/huggingface/hub/models--IDEA-Research--grounding-dino-tiny
          key: gdino-processor-${{ env.GDINO_PROCESSOR_REVISION }}
      - name: Fetch the pinned Grounding DINO processor files (only when not cached)
        if: matrix.service == 'reconstruction'
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          rev, args = os.environ["GDINO_PROCESSOR_REVISION"], {"allow_patterns": ["*.json", "*.txt"]}
          try:
              path = snapshot_download("IDEA-Research/grounding-dino-tiny", revision=rev, local_files_only=True, **args)
          except Exception:
              path = snapshot_download("IDEA-Research/grounding-dino-tiny", revision=rev, **args)
          print("processor files:", path, sorted(os.listdir(path)))
          PY
      - name: Committed test fixtures are present (packages/contracts/fixtures/README.md)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check-fixtures.sh"
      - name: Lint
        run: ruff check .
      - name: Tests (CPU, required; open3d tests run in the open3d job; gpu-, integration-, acceptance-marked ones are reported below)
        # Offline: no test may download anything (the processor files above are already cached).
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          set +e
          python -m pytest -q -rfEs -m "not gpu and not open3d and not integration and not acceptance" --junitxml=cpu.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" cpu.xml --label "${{ matrix.service }}: CPU suite (required)" \
            --mode required --expected-skip "$CPU_EXPECTED_SKIPS" | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]
      - name: Not executed in this job (needs a GPU/reconstruction toolchain or live services)
        # These run (and skip themselves with a reason) so the reasons are in the log and the job summary. They are NOT
        # passed: CPU execution here proves nothing about CUDA/gsplat/COLMAP. Where each runs: test_stack_e2e.py in
        # reconstruction-smoke's stack-smoke job; test_minio_storage.py in the minio-integration job below; the acceptance
        # suite in the acceptance workflow; the gpu tests in the gpu workflow.
        if: matrix.service == 'reconstruction'
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          set +e
          python -m pytest -q -rfEs -m "(gpu and not open3d) or integration or acceptance" --junitxml=not-run.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" not-run.xml --label "reconstruction: GPU, stack and acceptance tests" \
            --mode not-executed | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          # pytest exits 5 when every selected test was skipped; anything else non-zero is a real failure.
          { [ "$tests" -eq 0 ] || [ "$tests" -eq 5 ]; } && [ "$summary" -eq 0 ]
      - name: Every open3d test is where the open3d job collects it (tests/gpu), so none is silently left out
        if: matrix.service == 'reconstruction'
        run: |
          outside=$(python -m pytest --collect-only -q -m open3d 2>/dev/null | grep "::" | grep -v "^tests/gpu/" || true)
          if [ -n "$outside" ]; then echo "::error::open3d tests outside tests/gpu would not run in the open3d job:"; echo "$outside"; exit 1; fi
          python -m pytest --collect-only -q -m open3d 2>/dev/null | grep -c "::"
      - name: The real navmesh fixture tests ran (a skip here means the tool was not found, and fails the job)
        if: matrix.service == 'reconstruction'
        run: |
          set +e
          python -m pytest -q -rfEs -m navmesh --junitxml=navmesh.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" navmesh.xml --label "reconstruction: real Recast/Detour (required)" \
            --mode required | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]
      - name: The splat training tests ran (colour, densification, checkpoint/resume, time budget, partial status)
        if: matrix.service == 'reconstruction'
        run: |
          set +e
          python -m pytest -q -rfEs tests/splat tests/unit/test_splat_color.py --junitxml=splat.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" splat.xml --label "reconstruction: splat training on CPU (required)" \
            --mode required | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pytest-${{ matrix.service }}
          path: services/${{ matrix.service }}/*.xml
          if-no-files-found: ignore
          retention-days: 14

  # Synthetic reconstruction on the CPU with Open3D: real FPFH registration for re-scans, GEOMETRIC_CLEANUP and PLANE_FITTING
  # on synthetic rooms. No GPU is involved; these were marked gpu, so no CPU job ever ran them. Required: a skip fails.
  # Collected from tests/gpu only (where they live; the test job checks that): the rest of the suite needs torch/transformers.
  open3d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/reconstruction
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/reconstruction/pyproject.toml
      - name: Open3D's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1 libgl1
      - name: The worker and Open3D (CPU build, pinned as in benchmarks/docker/open3d.Dockerfile)
        run: |
          pip install -e ".[dev]"
          pip install "open3d-cpu==0.19.0"
      - name: Open3D tests (required)
        run: |
          set +e
          python -m pytest -q -rfEs -m open3d tests/gpu --junitxml=open3d.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" open3d.xml --label "reconstruction: Open3D on the CPU (required)" \
            --mode required | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pytest-open3d
          path: services/reconstruction/open3d.xml
          if-no-files-found: ignore
          retention-days: 14

  # Python service integration: the worker's S3 storage adapter against a real, throwaway MinIO (the pinned mirror image of
  # infra/mirror/minio/image.env, random root credentials). tests/integration/test_minio_storage.py creates and deletes its
  # own buckets, so it needs root, which the stack smoke's least-privilege worker account is not: it ran nowhere before.
  minio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/reconstruction
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/reconstruction/pyproject.toml
      - name: A throwaway MinIO (pinned by digest)
        run: |
          ref=$(. "$GITHUB_WORKSPACE/infra/mirror/minio/image.env"; echo "$MIRROR@$DIGEST")
          user="it$(openssl rand -hex 6)"; pass="$(openssl rand -hex 20)"
          echo "::add-mask::$pass"
          docker run -d --name it-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER="$user" -e MINIO_ROOT_PASSWORD="$pass" "$ref" server /data
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/minio/health/ready
          { echo "CHAYA_IT_S3_ENDPOINT=http://127.0.0.1:9000"; echo "CHAYA_IT_S3_ACCESS_KEY=$user"; echo "CHAYA_IT_S3_SECRET_KEY=$pass"; } >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - name: MinIO integration tests (required)
        run: |
          set +e
          python -m pytest -q -rfEs -m integration tests/integration/test_minio_storage.py --junitxml=minio.xml
          tests=$?
          python "$GITHUB_WORKSPACE/scripts/ci/pytest-summary.py" minio.xml --label "reconstruction: storage adapter against MinIO (required)" --mode required | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          [ "$tests" -eq 0 ] && [ "$summary" -eq 0 ]
