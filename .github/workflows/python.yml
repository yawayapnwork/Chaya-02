# Python services: lint (ruff: pyflakes, pycodestyle, bugbear, isort, pyupgrade, bandit) and tests.
# The CPU stages run for real and may not skip. The worker's `gpu` and `integration` tests cannot run here (no GPU, no
# stack): they are selected separately, and the job summary lists each one as NOT executed, with its reason.
name: python

on:
  pull_request:
    paths: ["services/reconstruction/**", "services/vision/**", "packages/contracts/fixtures/**", "packages/contracts/viewer/**", "scripts/ci/check-fixtures.sh", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["services/reconstruction/**", "services/vision/**", "packages/contracts/fixtures/**", "packages/contracts/viewer/**", "scripts/ci/check-fixtures.sh", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [reconstruction, vision]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: System tools the worker's CPU stages execute
        if: matrix.service == 'reconstruction'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build chaya-navmesh (real Recast/Detour; recastnavigation pinned by SHA-256 in its CMakeLists.txt)
        if: matrix.service == 'reconstruction'
        run: |
          cmake -S native/chaya-navmesh -B native/chaya-navmesh/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/chaya-navmesh/build -j "$(nproc)"
          native/chaya-navmesh/build/chaya-navmesh --version
      - run: pip install -e ".[dev]"
      - name: CPU PyTorch for the splat training tests (no GPU in CI; gsplat's CUDA training runs only on GPU hosts)
        if: matrix.service == 'reconstruction'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Committed test fixtures are present (packages/contracts/fixtures/README.md)
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check-fixtures.sh"
      - name: Lint
        run: ruff check .
      - name: Tests (CPU; gpu- and integration-marked tests are excluded here and reported below)
        # Nothing selected here may skip: a skip would mean a missing tool or fixture, i.e. a test that did not run.
        # The one allowed skip is pytest's "got empty parameter set": test_unwritten_stages_never_succeed... is
        # parametrized over the stages still marked planned, of which there are none today.
        run: |
          python -m pytest -q -rs -m "not gpu and not integration" | tee tests.txt
          if grep "^SKIPPED" tests.txt | grep -v "got empty parameter set"; then
            echo "::error::tests skipped in the CPU suite (see above)"; exit 1
          fi
      - name: Not executed in this job (needs a GPU/reconstruction toolchain or live services)
        # These run (and skip themselves with a reason) so the reasons are in the log and the job summary. They are NOT
        # passed: CPU execution here proves nothing about CUDA/gsplat/COLMAP. The integration tests run against a real
        # stack in reconstruction-smoke's stack-smoke job (test_stack_e2e.py); test_minio_storage.py needs CHAYA_IT_S3_*.
        if: matrix.service == 'reconstruction'
        run: |
          python -m pytest -q -rs -m "gpu or integration" | tee not-run.txt
          {
            echo "### Worker tests NOT executed in this job"
            echo "| test | reason |"
            echo "|---|---|"
            grep "^SKIPPED" not-run.txt | sed -E 's/^SKIPPED \[[0-9]+\] ([^:]+:[0-9]+): (.*)$/| `\1` | \2 |/'
            grep -E "[0-9]+ (passed|skipped)" not-run.txt | tail -1 | sed 's/^/Summary: /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The real navmesh fixture tests ran (a skip here means the tool was not found, and fails the job)
        if: matrix.service == 'reconstruction'
        run: |
          python -m pytest -q -rs -m navmesh | tee navmesh.txt
          if grep -q "SKIPPED" navmesh.txt; then echo "::error::navmesh tests skipped"; exit 1; fi
          grep -Eq "[0-9]+ passed" navmesh.txt
      - name: The splat training tests ran (colour, densification, checkpoint/resume, time budget, partial status)
        if: matrix.service == 'reconstruction'
        run: |
          python -m pytest -q -rs tests/splat tests/unit/test_splat_color.py | tee splat.txt
          if grep -q "SKIPPED" splat.txt; then echo "::error::splat training tests skipped"; exit 1; fi
          grep -Eq "[0-9]+ passed" splat.txt
