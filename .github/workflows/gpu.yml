# GPU tests (docs/ACCEPTANCE.md, class E): the worker's `gpu`-marked tests in the production GPU image, on a CUDA host.
#
# Never runs on GitHub's CPU-only runners: it needs a self-hosted runner labelled `gpu` (an NVIDIA GPU with compute
# capability >= 7.0, a CUDA 12.6 driver, Docker with the NVIDIA Container Toolkit; DEPLOYMENT.md "GPU workers"). Started by
# hand. Until such a runner is registered the run waits in the queue: that is "not executed", never "passed".
#
# CHAYA_REQUIRE_GPU=1 makes the splat acceptance test FAIL (with its preflight report) instead of skipping when the image
# cannot train. Every skip is unexpected, except the real-media and real-dataset tests when their input is left empty.
name: gpu

on:
  workflow_dispatch:
    inputs:
      image_sequence:
        description: "Folder on the GPU runner holding real overlapping photos (real-media tests). Empty: those tests are not executed."
        required: false
        default: ""
      splat_dataset:
        description: "COLMAP project folder on the GPU runner (images/, sparse/0) for the splat acceptance. Empty: the synthetic scene."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gpu
  cancel-in-progress: false

jobs:
  # Runs on a GitHub-hosted runner first, so every run states plainly what it is waiting for. If gpu-tests below stays
  # "Queued", no online self-hosted runner has the `gpu` label: GPU acceptance is BLOCKED, not passed. (GitHub gives a
  # workflow no way to list self-hosted runners without an admin token, so this is a statement, not a probe.)
  requirement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          {
            echo "### GPU acceptance needs a self-hosted runner labelled \`gpu\`"
            echo ""
            echo "NVIDIA GPU (compute capability >= 7.0), CUDA 12.6 driver (>= 560), Docker with the NVIDIA Container Toolkit,"
            echo ">= 80 GB free disk (DEPLOYMENT.md \"GPU workers\"). If the \`gpu-tests\` job is still queued, none is online:"
            echo "**BLOCKED, not executed**. Nothing in this run proves CUDA training until \`gpu-tests\` completes."
          } >> "$GITHUB_STEP_SUMMARY"

  gpu-tests:
    needs: requirement
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A CUDA device is present
        run: nvidia-smi
      # The same procedure as a manual GPU host (scripts/gpu/acceptance.sh): build, preflight, stage offer, the real CC0
      # dataset reconstructed with the image's COLMAP, then gsplat training on CUDA through the production stages.
      # Exit 3 (BLOCKED: no GPU, toolkit or disk) fails this job too: blocked is never passed.
      - name: GPU acceptance (scripts/gpu/acceptance.sh, real CC0 dataset)
        env:
          IMAGE: chaya-worker-gpu:${{ github.sha }}
          DATA: ${{ runner.temp }}/gpu-data
        run: bash scripts/gpu/acceptance.sh "$RUNNER_TEMP/gpu-acceptance"
      - name: Model weights at their pinned revisions (persistent volume chaya-models)
        run: docker run --rm -v chaya-models:/models "chaya-worker-gpu:${GITHUB_SHA}" python /opt/chaya/fetch_models.py
      - name: GPU tests (pytest -m gpu, CHAYA_REQUIRE_GPU=1)
        id: tests
        env:
          IMAGE_SEQUENCE: ${{ github.event.inputs.image_sequence }}
          SPLAT_DATASET: ${{ github.event.inputs.splat_dataset }}
        run: |
          mkdir -p gpu-out
          extra=()
          [ -n "$IMAGE_SEQUENCE" ] && extra+=(-v "$IMAGE_SEQUENCE:/data/images:ro" -e CHAYA_TEST_IMAGE_SEQUENCE=/data/images)
          [ -n "$SPLAT_DATASET" ] && extra+=(-v "$SPLAT_DATASET:/data/splat:ro" -e CHAYA_SPLAT_DATASET=/data/splat)
          set +e
          # --user 0 only so pip can add pytest to the image's root-owned venv for the test run (as the test's docstring says).
          docker run --rm --gpus all --user 0 -e CHAYA_REQUIRE_GPU=1 -e CHAYA_GPU_ACCEPTANCE_REPORT=/out/gpu-acceptance.json \
            -v chaya-models:/models -v "$PWD/services/reconstruction/tests:/src/tests:ro" -v "$PWD/gpu-out:/out" "${extra[@]}" \
            -w /src "chaya-worker-gpu:${GITHUB_SHA}" \
            sh -c "pip install -q pytest==8.4.1 && python -m pytest -p no:cacheprovider -m gpu tests/gpu -rfEs --junitxml=/out/gpu.xml"
          status=$?
          echo "pytest exit status: $status"
          # Kept for the summary step below (it classifies every test); a crash before any JUnit is written fails here.
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ -s gpu-out/gpu.xml ] || { echo "::error::pytest wrote no results (exit $status)"; exit 1; }
      - name: Summary (passed / failed / expected skip / unexpected skip)
        env:
          IMAGE_SEQUENCE: ${{ github.event.inputs.image_sequence }}
          PYTEST_STATUS: ${{ steps.tests.outputs.status }}
        run: |
          expected=()
          [ -z "$IMAGE_SEQUENCE" ] && expected+=(--expected-skip "CHAYA_TEST_IMAGE_SEQUENCE is not set")
          set +e
          python3 scripts/ci/pytest-summary.py gpu-out/gpu.xml --label "GPU tests (required)" --mode required "${expected[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          summary=${PIPESTATUS[0]}
          # pytest's own status counts too (exit 5 = nothing collected, 2-4 = interrupted or internal/usage errors).
          [ "$summary" -eq 0 ] && [ "$PYTEST_STATUS" -eq 0 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gpu-evidence
          # The acceptance evidence (build log, preflight, capabilities, dataset provenance, report, JUnit) and the full
          # -m gpu suite's results. The dataset photographs themselves are not uploaded.
          path: |
            gpu-out/
            ${{ runner.temp }}/gpu-acceptance/
            !${{ runner.temp }}/gpu-acceptance/data/
          retention-days: 90
