# Weekly update PRs for everything CI and the images depend on. Every PR runs the full workflow set before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directory: /services/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /services/reconstruction
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /services/vision
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/reconstruction
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/vision
    schedule: { interval: weekly }
